sentence=A (non-blocking) library for the Digital Addressable Lighting Interface (DALI).
paragraph=Drives a DALI bus over two pins using a hardware timer for the 1200 baud manchester encoding, so sending and receiving never block the sketch. Supports ARC level and DALI commands, short/group/broadcast addressing, commissioning and responses. Select the hardware timer with the DALI_TIMER build flag (AVR: 1-3, ESP32/ESP8266: 0-1, RP2040: 0-3), or define DALI_NO_TIMER and call DaliBus.timerISR() yourself.
category=Device Control
url=https://github.com/atvirokodosprendimai/arduino-dali
architectures=*
depends=TimerInterrupt_Generic
includes=Dali.h
